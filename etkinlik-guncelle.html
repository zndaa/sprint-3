<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Güncelle</title>
  <link rel="stylesheet" href="2416501033.css">
  <script type="module" src="js/event-form.js"></script>
</head>
<body>

  <header>
    <h1>Etkinlik Güncelle</h1>
    <nav>
      <a href="index.html">Ana Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-ekle.html">Ekle</a>
    </nav>
  </header>

  <main class="form-sayfasi">
    <!-- id yoksa JS buraya kırmızı uyarı kutusunu koyacak -->
    <div id="guncelle-uyari"></div>

    <!-- id varsa bu form görünecek, yoksa JS formu gizleyecek -->
    <div id="guncelle-form-kapsayici">
      <p class="bilgi-notu">Alanlar mevcut etkinliğin bilgileriyle dolu gelir. Bu sprintte form veri güncellemez.</p>

      <form id="etkinlik-formu" novalidate>
        <div class="form-grup">
          <label for="ad">Etkinlik Adı *</label>
          <input type="text" id="ad" name="ad">
          <span id="ad-hata" class="hata-mesaj"></span>
        </div>

        <div class="form-grup">
          <label for="kategori">Kategori *</label>
          <select id="kategori" name="kategori">
            <option value="">Seçiniz</option>
            <option value="Seminer">Seminer</option>
            <option value="Atölye">Atölye</option>
            <option value="Söyleşi">Söyleşi</option>
          </select>
          <span id="kategori-hata" class="hata-mesaj"></span>
        </div>

        <div class="form-grup">
          <label for="tarih">Tarih *</label>
          <input type="date" id="tarih" name="tarih">
          <span id="tarih-hata" class="hata-mesaj"></span>
        </div>

        <div class="form-grup">
          <label for="saat">Saat *</label>
          <input type="time" id="saat" name="saat">
          <span id="saat-hata" class="hata-mesaj"></span>
        </div>

        <div class="form-grup">
          <label for="yer">Yer *</label>
          <input type="text" id="yer" name="yer" placeholder="Örn. A Blok Konferans Salonu">
          <span id="yer-hata" class="hata-mesaj"></span>
        </div>

        <div class="form-grup">
          <label for="kapasite">Kontenjan</label>
          <input type="number" id="kapasite" name="kapasite">
          <span id="kapasite-hata" class="hata-mesaj"></span>
        </div>

        <div class="form-grup">
          <label for="aciklama">Açıklama</label>
          <textarea id="aciklama" name="aciklama" rows="4"></textarea>
          <span id="aciklama-hata" class="hata-mesaj"></span>
        </div>

        <button type="submit" class="btn-kaydet">Güncelle</button>
      </form>

      <div id="form-mesaj"></div>
    </div>
  </main>

  <footer>
    <p>zeynep nida çiçek · 2416501033 · 2026</p>
  </footer>

</body>
</html>
